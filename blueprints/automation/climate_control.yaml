blueprint:
  name: Simple Climate Control Automation
  description: Start AC with selected mode and temperature when sensor drops below threshold, stop when target temperature is reached
  domain: automation
  input:
    climate_entity:
      name: Climate Entity
      description: The air conditioner/climate device to control
      selector:
        entity:
          filter:
            - domain: climate
    temperature_sensor:
      name: Temperature Sensor
      description: The temperature sensor to monitor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    min_temperature:
      name: Minimum Temperature Threshold
      description: When temperature drops below this, start heating
      default: 20
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°"
          mode: box
    target_temperature:
      name: Target Temperature
      description: Heat to this temperature, then stop
      default: 22
      selector:
        number:
          min: 10
          max: 40
          step: 0.5
          unit_of_measurement: "°"
          mode: box
    ac_temperature:
      name: AC Set Temperature
      description: The temperature to set on the AC when it turns on
      default: 24
      selector:
        number:
          min: 10
          max: 40
          step: 0.5
          unit_of_measurement: "°"
          mode: box
    ac_mode:
      name: AC Mode
      description: The HVAC mode to use when turning on the AC
      default: heat
      selector:
        select:
          options:
            - label: Heat
              value: heat
            - label: Cool
              value: cool
            - label: Heat/Cool (Auto)
              value: heat_cool
            - label: Dry
              value: dry
            - label: Fan Only
              value: fan_only
    time_start:
      name: Start Time
      description: Time when automation becomes active (leave default 00:00 for always active)
      default: "00:00:00"
      selector:
        time:
    time_end:
      name: End Time
      description: Time when automation stops being active (leave default 00:00 for always active)
      default: "00:00:00"
      selector:
        time:
    active_days:
      name: Active Days
      description: Days of the week when automation is active (select none for all days)
      default: []
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun

trigger:
  - platform: numeric_state
    entity_id: !input temperature_sensor
    below: !input min_temperature
    id: "temp_low"
  - platform: numeric_state
    entity_id: !input temperature_sensor
    above: !input target_temperature
    id: "temp_high"
  - platform: homeassistant
    event: start
    id: "ha_start"
  - platform: event
    event_type: automation_reloaded
    id: "automation_reloaded"
  - platform: time
    at: !input time_end
    id: "time_window_ended"
  - platform: time
    at: !input time_start
    id: "time_window_started"
  - platform: time
    at: "00:00:00"
    id: "day_changed"

variables:
  time_start_var: !input time_start
  time_end_var: !input time_end
  active_days_var: !input active_days
  temperature_sensor_var: !input temperature_sensor
  min_temperature_var: !input min_temperature
  target_temperature_var: !input target_temperature
  # Scheduling is fully disabled when both times are 00:00 and no days are selected.
  scheduling_disabled: "{{ time_start_var == '00:00:00' and time_end_var == '00:00:00' and active_days_var | length == 0 }}"
  # Treat matching start/end times as an "all day" window (e.g., 00:00 -> 00:00).
  time_window_disabled: "{{ time_start_var == time_end_var }}"
  current_day: "{{ now().strftime('%a') | lower }}"
  is_active_day: "{{ active_days_var | length == 0 or current_day in active_days_var }}"
  current_temp: "{{ states(temperature_sensor_var) | float(0) }}"
  temp_below_min: "{{ current_temp < min_temperature_var }}"
  temp_above_target: "{{ current_temp > target_temperature_var }}"
  # Compute time window in template to support overnight ranges (e.g., 22:00 -> 06:00).
  is_within_time_window: >-
    {% set start = today_at(time_start_var) %}
    {% set end = today_at(time_end_var) %}
    {% set now_ts = now() %}
    {% if time_window_disabled %}
      true
    {% elif start < end %}
      {{ start <= now_ts and now_ts <= end }}
    {% else %}
      {{ now_ts >= start or now_ts <= end }}
    {% endif %}

condition:
  - condition: or
    conditions:
      # Always allow if scheduling is disabled (both times 00:00 and no days selected)
      - condition: template
        value_template: "{{ scheduling_disabled }}"
      # Allow time triggers to bypass time check (they handle their own logic)
      - condition: trigger
        id: "time_window_ended"
      - condition: trigger
        id: "time_window_started"
      - condition: trigger
        id: "day_changed"
      # Otherwise check if current time and day are within the window
      - condition: and
        conditions:
          # Use template to allow overnight windows and "all day" schedules.
          - condition: template
            value_template: "{{ is_within_time_window }}"
          - condition: template
            value_template: "{{ is_active_day }}"

action:
  - choose:
      # Temperature dropped below minimum - start AC
      - conditions:
          - condition: trigger
            id: "temp_low"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: !input ac_temperature
              hvac_mode: !input ac_mode

      # Temperature reached target - stop heating
      - conditions:
          - condition: trigger
            id: "temp_high"
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

      # Time window ended - turn off AC
      - conditions:
          - condition: trigger
            id: "time_window_ended"
          # Only if scheduling is enabled and it's an active day
          - condition: template
            value_template: "{{ not scheduling_disabled and is_active_day }}"
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

      # Time window started - check if AC should turn on
      - conditions:
          - condition: trigger
            id: "time_window_started"
          # Only if scheduling is enabled and it's an active day
          - condition: template
            value_template: "{{ not scheduling_disabled and is_active_day }}"
          # Only if the time window is not disabled (avoids redundant midnight trigger)
          - condition: template
            value_template: "{{ not time_window_disabled }}"
          # Only if temperature is below minimum
          - condition: template
            value_template: "{{ temp_below_min }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: !input ac_temperature
              hvac_mode: !input ac_mode

      # Day changed at midnight - turn off AC if new day is inactive
      - conditions:
          - condition: trigger
            id: "day_changed"
          # Only if day-based scheduling is enabled and new day is inactive
          - condition: template
            value_template: "{{ active_days_var | length > 0 and not is_active_day }}"
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

      # On HA start or automation reload - check current state
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "ha_start"
              - condition: trigger
                id: "automation_reloaded"
        sequence:
          - choose:
              # If temperature is below minimum and scheduling allows, start AC
              - conditions:
                  - condition: template
                    value_template: "{{ temp_below_min and (scheduling_disabled or (is_active_day and is_within_time_window)) }}"
                sequence:
                  - service: climate.set_temperature
                    target:
                      entity_id: !input climate_entity
                    data:
                      temperature: !input ac_temperature
                      hvac_mode: !input ac_mode
              # If temperature is above target, stop heating
              - conditions:
                  - condition: template
                    value_template: "{{ temp_above_target }}"
                sequence:
                  - service: climate.turn_off
                    target:
                      entity_id: !input climate_entity

mode: single
